# ==============================================================================
# 🎨 THEME CONFIGURATION
# ==============================================================================
theme = "rose_pine_moon"

# ==============================================================================
# ⚙️ EDITOR SETTINGS
# ==============================================================================
[editor]
line-number = "relative"
scrolloff = 5
mouse = true
color-modes = true
bufferline = "multiple"
auto-format = true

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true
character = "╎"

[editor.soft-wrap]
enable = true

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.statusline]
left = ["mode", "spinner", "file-name", "read-only-indicator", "file-modification-indicator"]
right = ["diagnostics", "selections", "position", "file-encoding", "file-type"]
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
